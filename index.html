<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAS Simulation Fleet</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="tutor.css">
</head>
<body>

    <div id="top-ribbon">
        <button class="btn" onclick="BAS_API.adjustTime(-3600)">◀ -1 Hour</button>
        <div style="display:flex; align-items:center; gap:10px;">
            <div id="datetime-display">MON 04:00</div>
            <button class="btn" id="slow-btn"
                onmousedown="BAS_Environment.startHold()"
                onmouseup="BAS_Environment.endHold()"
                onmouseleave="BAS_Environment.endHold()"
                title="Hold to set slow duration (30s→5s), release to commit">⏳</button>
        </div>
        <button class="btn" onclick="BAS_API.adjustTime(3600)">+1 Hour ▶</button>
    </div>

    <div id="main-container">
        <div id="left-panel">
            <div id="debug-log"></div>
        </div>

        <div id="canvas-grid"></div>

        <div id="control-panel">
            <div class="toggle-row">
                <label class="toggle-switch">
                    <input type="checkbox" id="buffer-toggle" onchange="BAS_API.toggleBuffer(this.checked)">
                    <span class="toggle-slider"></span>
                </label>
                <span>+10 min buffer</span>
            </div>
            <hr style="border-color:#2d3748; margin:10px 0;">
            <h3 style="margin-top:0">Manual Override</h3>
            <label>Room ID:</label>
            <input type="text" id="override-room" value="101" maxlength="3" placeholder="e.g. 101">
            <div style="display:flex; gap:8px; margin-top:4px;">
                <button class="btn btn-on"  style="flex:1" onclick="BAS_API.manualSetLight(1)">💡 ON</button>
                <button class="btn btn-off" style="flex:1" onclick="BAS_API.manualSetLight(0)">🌑 OFF</button>
            </div>
            <div style="font-size:0.72rem; color:#718096; margin:8px 0 12px;">Overridden on next reconcile tick</div>
            <hr style="border-color:#2d3748; margin:0 0 10px;">
            <h3 style="margin-top:0">Add Schedule</h3>
            <label>Day:</label>
            <select id="man-day">
                <option>MON</option><option>TUE</option><option>WED</option>
                <option>THU</option><option>FRI</option><option>SAT</option>
            </select>
            <label>Room:</label>
            <input type="text" id="man-room" value="101" maxlength="3">
            <label>Start / End Hour:</label>
            <div style="display:flex; gap:5px">
                <input type="number" id="man-start" value="8"  min="0" max="23">
                <input type="number" id="man-end"   value="10" min="0" max="23">
            </div>
            <button class="btn" style="width:100%; margin-bottom:10px;" onclick="BAS_API.addManualClass()">+ Add</button>
            <div id="active-schedules" style="overflow-y:auto;"></div>
        </div>
    </div>

    <div id="bottom-ribbon">
        <div id="mini-floor-1" class="floor-nav floor-active" onclick="BAS_UI.changeFloor(1)"><div>F1</div><div class="mini-floor"></div></div>
        <div id="mini-floor-2" class="floor-nav"              onclick="BAS_UI.changeFloor(2)"><div>F2</div><div class="mini-floor"></div></div>
        <div id="mini-floor-3" class="floor-nav"              onclick="BAS_UI.changeFloor(3)"><div>F3</div><div class="mini-floor"></div></div>
    </div>

    <div id="tutor-card">
    <div class="tutor-step-badge" id="tutor-badge">Langkah 1 / 5</div>
    <div class="tutor-title"   id="tutor-title"></div>
    <div class="tutor-body"    id="tutor-body"></div>
    <div class="tutor-footer">
        <div class="tutor-dots" id="tutor-dots"></div>
        <button id="tutor-next">Lanjut →</button>
    </div>
    </div>

    <script src="tutor.js"></script>
    <script src="app.js"></script>
</body>
</html>
